schema_version: 2
stage: C_source_internal_candidate_processing
supersedes_for_future_stage_c:
  path: research/output-schema.yaml
  preserved_unchanged: true
status_enum:
  - known
  - officially_unknown
  - not_recoverable
  - inferred_from_filename
  - verified_from_source_metadata
global_contract:
  immutable_input_run_id: 20260805T230449Z
  source_object_id_formula: acquisition_run_id + '/' + canonical_source_object_relative_path
  source_object_sha256_semantics: content_integrity_only
  depth_unit: m
  depth_direction: positive_down
  longitude_range: "[-180,180)"
  latitude_range: "[-90,90]"
  time_zone: UTC
  held_out: true
  cross_cruise_pooling: false
  confirmation_role_eligible: false
tables:
